<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Für Minnosum ❤️</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,.85), transparent 28%),
      linear-gradient(135deg,#ffc7dd 0%,#ffe6ef 45%,#fff7fb 100%);
  }
  .glow{
    position:absolute; inset:-20%;
    background:radial-gradient(circle, rgba(255,72,126,.18), transparent 55%);
    animation:pulse 4s ease-in-out infinite;
  }
  .card{
    position:relative;
    z-index:2;
    width:min(88vw,560px);
    padding:46px 28px 40px;
    border-radius:32px;
    text-align:center;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 24px 70px rgba(150,20,70,.18);
    border:1px solid rgba(255,255,255,.75);
  }
  .heart-main{
    font-size:68px;
    filter:drop-shadow(0 8px 16px rgba(220,30,90,.25));
    animation:beat 1.5s ease-in-out infinite;
  }
  h1{
    margin:12px 0 10px;
    font-size:clamp(34px,8vw,64px);
    line-height:1.05;
    color:#cf245f;
    letter-spacing:-1.5px;
  }
  p{
    margin:12px auto 0;
    max-width:420px;
    font-size:clamp(17px,4vw,22px);
    color:#7d3651;
    line-height:1.5;
  }
  .small{
    margin-top:20px;
    font-size:15px;
    color:#a65b75;
  }
  .floating-heart{
    position:absolute;
    bottom:-40px;
    font-size:24px;
    opacity:.8;
    animation:floatUp linear infinite;
    z-index:1;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) scale(.8) rotate(0deg);opacity:0}
    10%{opacity:.85}
    100%{transform:translateY(-115vh) scale(1.35) rotate(18deg);opacity:0}
  }
  @keyframes beat{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.12)}
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);opacity:.8}
    50%{transform:scale(1.08);opacity:1}
  }
</style>
</head>
<body>
<div class="glow"></div>

<div class="card">
  <div class="heart-main">❤️</div>
  <h1>Ich liebe dich, Minnosum</h1>
  <p>Du bist mein Lieblingsmensch. Mit dir fühlt sich alles ein bisschen schöner an. ❤️</p>
  <div class="small">Für immer du & ich ✨</div>
</div>

<script>
  const hearts = ["❤️","💗","💕","💖","💞"];
  for(let i=0;i<22;i++){
    const h=document.createElement("div");
    h.className="floating-heart";
    h.textContent=hearts[Math.floor(Math.random()*hearts.length)];
    h.style.left=Math.random()*100+"vw";
    h.style.animationDuration=(5+Math.random()*5)+"s";
    h.style.animationDelay=(-Math.random()*8)+"s";
    h.style.fontSize=(18+Math.random()*24)+"px";
    document.body.appendChild(h);
  }
</script>
</body>
</html>
